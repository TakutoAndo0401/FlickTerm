name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  mac:
    name: macOS
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.14.1"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "11.4.0"

      - name: Setup Rust
        run: rustup toolchain install 1.95.0 --profile minimal

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build macOS app bundle
        run: pnpm build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Archive macOS app bundle
        run: ditto -c -k --keepParent src-tauri/target/release/bundle/macos/FlickTerm.app FlickTerm-${GITHUB_REF_NAME}-macos.app.zip

      - name: Publish GitHub release
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "FlickTerm ${GITHUB_REF_NAME} - Rust/Tauri 移行" \
            --notes-from-tag
          gh release upload "$GITHUB_REF_NAME" "FlickTerm-${GITHUB_REF_NAME}-macos.app.zip" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
